<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cierre — Fundación Barceló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Pantalla de cierre — Manual de marca Fundación Barceló 2026.
     Para dejar en loop, sin sonido, cuando termina el evento: "El evento ha finalizado".
     Parametros por URL (opcionales):  ?evento=Nombre del evento   (se muestra arriba, en celeste)
                                       ?figura=b | tab | arco       (la figura que flota; por defecto b)
     Diseno: azul de marca en tonos, una luz suave que respira y figuras del manual de marca que flotan muy
     despacio (las grandes, desenfocadas, para dar profundidad). Todo lento y continuo, para transmitir calma:
       tab  = bloque cuadrado con una esquina muy redondeada (la forma de los bloques del manual)
       arco = el trazo blanco fino del fondo de pantalla del manual
       b    = el isotipo "B" de la marca */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --azul:#0061F0; --marino:#06038D; --cian:#00D1FF; }

  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--azul); }
  body { font-family: 'Sofia Pro', 'Montserrat', sans-serif; color: #fff; }

  /* Fondo tonal a pantalla completa (fuera del escenario escalado, asi llega a todos los bordes) */
  #fondo { position: fixed; inset: 0; overflow: hidden; background: var(--azul); }
  #fondo .luz { position: absolute; border-radius: 50%; will-change: transform; }
  #fondo .l1 { width: 95vw; height: 85vh; left: -22vw; top: -28vh;
               background: radial-gradient(closest-side, rgba(255,255,255,.16), rgba(255,255,255,0)); animation: l1 48s ease-in-out infinite alternate; }
  #fondo .l2 { width: 100vw; height: 90vh; right: -26vw; bottom: -34vh;
               background: radial-gradient(closest-side, rgba(6,3,141,.62), rgba(6,3,141,0)); animation: l2 56s ease-in-out infinite alternate; }
  @keyframes l1 { from { transform: translate(-3vw, -2vh); } to { transform: translate(12vw, 8vh); } }
  @keyframes l2 { from { transform: translate(4vw, 3vh); }   to { transform: translate(-10vw, -7vh); } }

  /* Las figuras desaparecen alrededor del logo (abajo a la izquierda): el manual pide un area libre alrededor de la marca */
  .figs { position: absolute; inset: 0;
          -webkit-mask-image: radial-gradient(ellipse 20% 14% at 16% 86%, transparent 55%, #000 100%);
                  mask-image: radial-gradient(ellipse 20% 14% at 16% 86%, transparent 55%, #000 100%); }
  /* Figuras del manual de marca: se crean con JS. Suben muy despacio, giran apenas y aparecen y se van suavemente. */
  .fig { position: absolute; width: var(--s); height: var(--s); opacity: 0; will-change: transform, opacity;
         animation: flota var(--d) ease-in-out var(--r) infinite; }
  /* tab: cuadrado con una esquina muy redondeada, como los bloques del manual */
  #fondo[data-figura="tab"] .fig { background: var(--c, #fff); border-radius: 100% 0 0 0; }
  /* arco: el trazo fino del fondo de pantalla del manual */
  #fondo[data-figura="arco"] .fig { border: max(2px, calc(var(--s) * .016)) solid var(--c, #fff); border-radius: 100% 0 0 0; }
  /* b: el isotipo de la marca */
  #fondo[data-figura="b"] .fig { height: calc(var(--s) * 1.2); background: var(--c, #fff);
         -webkit-mask: url(img/b.png) center / contain no-repeat; mask: url(img/b.png) center / contain no-repeat; }
  @keyframes flota {
    0%   { opacity: 0;          transform: translate(0, 5vh)            rotate(var(--g0)); }
    22%  { opacity: var(--o); }
    78%  { opacity: var(--o); }
    100% { opacity: 0;          transform: translate(var(--dx), -20vh)  rotate(var(--g1)); }
  }

  /* Escenario fijo 1920x1080 que se escala para entrar en cualquier pantalla */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

  .col { position: absolute; left: 170px; top: 0; bottom: 0; width: 1500px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-bottom: 40px; }
  .evento { font-size: 46px; font-weight: 700; letter-spacing: -.01em; color: var(--cian); margin-bottom: 16px; }
  .item { opacity: 0; animation: sube 1.6s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i, 0) * .3s + .4s); }
  @keyframes sube { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

  /* Titulo: se revela una vez y despues un brillo muy suave lo recorre cada tanto */
  h1 { display: inline-block; font-size: 130px; line-height: 1.04; font-weight: 700; letter-spacing: -.03em; text-wrap: balance; max-width: 1500px;
       padding: 0 .12em .16em 0; margin: 0 -.12em -.16em 0;
       color: transparent; -webkit-background-clip: text; background-clip: text;
       background-image: linear-gradient(100deg, #fff 0%, #fff 40%, #B9E9FF 50%, #fff 60%, #fff 100%);
       background-size: 320% 100%; background-position: 120% 0; clip-path: inset(0 100% 0 0);
       animation: revela 2.8s cubic-bezier(.45,0,.2,1) .8s forwards, brillo 24s ease-in-out 6s infinite; }
  @keyframes revela { to { clip-path: inset(0 0 0 0); } }
  @keyframes brillo { 0% { background-position: 120% 0; } 32%, 100% { background-position: -20% 0; } }

  /* Linea celeste: se traza una vez y una luz la recorre muy despacio, con pausas largas (movimiento por transform, sin saltos) */
  .linea { height: 5px; width: 0; margin-top: 44px; background: rgba(0,209,255,.30); border-radius: 3px; position: relative; overflow: hidden;
           animation: traza 2.8s cubic-bezier(.45,0,.2,1) 2.2s forwards; }
  .linea::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 110px; border-radius: 3px; will-change: transform;
                  background: linear-gradient(90deg, rgba(0,209,255,0), var(--cian) 50%, rgba(0,209,255,0));
                  transform: translateX(-130px); animation: viaja 16s cubic-bezier(.45,0,.55,1) 6s infinite; }
  @keyframes traza { to { width: 180px; } }
  @keyframes viaja { 0% { transform: translateX(-130px); } 45%, 100% { transform: translateX(200px); } }

  .sub { font-size: 38px; line-height: 1.4; font-weight: 500; color: rgba(255,255,255,.9); margin-top: 40px; }

  .logo { position: absolute; left: 170px; bottom: 96px; width: 260px; height: 90px; background: #fff; opacity: 0;
          -webkit-mask: url(/layouts/assets/logo-fundacion-blanco.png) left center / contain no-repeat;
                  mask: url(/layouts/assets/logo-fundacion-blanco.png) left center / contain no-repeat;
          animation: entra-logo 2s cubic-bezier(.22,1,.36,1) 3s both; }
  @keyframes entra-logo { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="fondo"><i class="luz l1"></i><i class="luz l2"></i><div class="figs" id="figs"></div></div>

<div id="stage">
  <div class="col">
    <div class="evento item" style="--i:0" id="evento"></div>
    <h1>El evento ha finalizado</h1>
    <div class="linea"></div>
    <div class="sub item" style="--i:6">Gracias por acompañarnos. ¡Hasta la próxima!</div>
  </div>
  <div class="logo" role="img" aria-label="Fundación Barceló"></div>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var $ = function (id) { return document.getElementById(id); };

  // ---- evento (opcional): se muestra como texto, nunca como HTML ----
  var evento = String(params.get('evento') || '').trim();
  $('evento').textContent = evento;
  $('evento').style.display = evento ? '' : 'none';

  // ---- escala el escenario a la pantalla (el fondo llena toda la ventana por su cuenta) ----
  var stage = $('stage');
  function escalar() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = 'translate(' + (innerWidth - 1920 * s) / 2 + 'px,' + (innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    document.documentElement.style.setProperty('--k', s);
  }
  addEventListener('resize', escalar); escalar();

  // ---- figuras del manual flotando: distintos tamanos, las grandes mas suaves y desenfocadas (profundidad) ----
  var fondo = $('fondo'), figs = $('figs'), r = function (a, b) { return a + Math.random() * (b - a); };
  var FIGURAS = ['tab', 'arco', 'b'];
  var figura = FIGURAS.indexOf(params.get('figura')) >= 0 ? params.get('figura') : 'b';
  fondo.setAttribute('data-figura', figura);
  var GIRO = figura === 'tab' || figura === 'arco';       // los bloques con una esquina redonda giran de a 90 grados
  var OPAC = figura === 'arco' ? 2.4 : 1;                 // el trazo fino necesita mas opacidad para verse
  var CANTIDAD = 20, frag = document.createDocumentFragment();
  for (var i = 0; i < CANTIDAD; i++) {
    var t = Math.pow(Math.random(), 1.5);                 // sesgo a tamanos chicos
    var size = 40 + t * 200;                              // 40 a 240 px (en un frame de 1080)
    var el = document.createElement('div');
    el.className = 'fig';
    el.style.left = r(-3, 97) + '%';
    el.style.top = r(10, 100) + '%';
    el.style.setProperty('--s', 'calc(' + size.toFixed(1) + 'px * var(--k, 1))');
    el.style.setProperty('--o', ((size > 130 ? r(.05, .09) : r(.09, .17)) * OPAC).toFixed(2));
    el.style.setProperty('--d', r(70, 120).toFixed(0) + 's');                  // muy lento: casi un minuto y medio por vuelta
    el.style.setProperty('--r', '-' + r(0, 120).toFixed(0) + 's');             // ya repartidas por la pantalla al cargar
    el.style.setProperty('--dx', r(-4, 4).toFixed(1) + 'vw');
    var g0 = GIRO ? Math.floor(r(0, 4)) * 90 + r(-8, 8) : r(-14, 14);
    el.style.setProperty('--g0', g0.toFixed(0) + 'deg');
    el.style.setProperty('--g1', (g0 + r(-28, 28)).toFixed(0) + 'deg');         // gira apenas durante el recorrido
    if (Math.random() < 0.25) el.style.setProperty('--c', '#7FE6FF');           // algunas en celeste claro
    if (size > 150) el.style.filter = 'blur(' + (size > 200 ? 3.5 : 2) + 'px)';
    frag.appendChild(el);
  }
  figs.appendChild(frag);
})();
</script>
</body>
</html>
