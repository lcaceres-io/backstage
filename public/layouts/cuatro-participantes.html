<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuatro Participantes — Barceló</title>
<link rel="stylesheet" href="/layouts/assets/marca-fondo.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #0061F0;
  }

  /* ===== Cuadrados croma — 4 participantes ===== */
  /* Ancho cuadrado: 465px. Gap interno: 12px. Margen lateral: 12px c/lado */
  .cuadrado {
    position: absolute;
    top: 98px;
    width: 465px;
    height: 755px;
    background: rgb(0, 255, 0);
    border: 1.7px solid #ffffff;
    box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.5);
  }

  .cuadrado-1 { left: 12px; }    /* 12 */
  .cuadrado-2 { left: 489px; }   /* 12 + 465 + 12 */
  .cuadrado-3 { left: 966px; }   /* 12 + 465 + 12 + 465 + 12 */
  .cuadrado-4 { left: 1443px; }  /* 12 + 465 + 12 + 465 + 12 + 465 + 12 */
</style>
</head>
<body>
  <div class="marca-bg"><i class="m-luz m-luz1"></i><i class="m-luz m-luz2"></i></div>
  <script src="/layouts/assets/marca-fondo.js"></script>

  <div class="cuadrado cuadrado-1"></div>
  <div class="cuadrado cuadrado-2"></div>
  <div class="cuadrado cuadrado-3"></div>
  <div class="cuadrado cuadrado-4"></div>

</body>
</html>
