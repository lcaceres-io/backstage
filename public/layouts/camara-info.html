<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cámara + Info — Barceló</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/layouts/assets/marca-fondo.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #0061F0;
  }

  /* ── Layout ── */
  .layout {
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: 392px 1528px;
    grid-template-rows: 860px 220px;
  }

  /* Panel izquierdo — solo contenido, sin bordes */
  .panel-left {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 24px;
    gap: 32px;
  }

  .logo-wrap img {
    width: 230px;
  }

  /* Zona cámara — completamente vacía */
  .camera-zone {
    grid-column: 2;
    grid-row: 1;
    background: transparent;
  }

  /* Barra inferior izquierda */
  .bar-left {
    grid-column: 1;
    grid-row: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* Barra inferior derecha */
  .bar-bottom {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 48px;
    gap: 8px;
  }

  .bar-title {
    font-family: 'Sofia Pro', 'Montserrat', sans-serif;
    font-size: 38px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }

  .bar-subtitle {
    font-family: 'Sofia Pro', 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #00D1FF;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="marca-bg"><i class="m-losa m-navy"></i><i class="m-losa m-cian"></i><i class="m-losa m-alta"></i><i class="m-losa m-marco"></i></div>
  <script src="/layouts/assets/marca-fondo.js"></script>

  <div class="layout">

    <div class="panel-left">
      <div class="logo-wrap">
      <img src="/layouts/assets/logo-fundacion-blanco.png" alt="Fundación Barceló" style="width:230px">
      </div>
    </div>

    <div class="camera-zone"></div>

    <div class="bar-left">
    </div>

    <div class="bar-bottom">
      <div class="bar-title">Fundación Barceló · Mundial FIFA 2026</div>
      <div class="bar-subtitle">Bar Barceló · Lo miramos juntos</div>
    </div>

  </div>

</body>
</html>
