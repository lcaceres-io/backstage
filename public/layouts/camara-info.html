<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cámara + Info — Barceló</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: linear-gradient(135deg, #001f3f 0%, #003875 40%, #004C97 100%);
  }

  .bg-radial {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 60% at 20% 50%, rgba(0,76,151,0.4) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 80% 80%, rgba(26,107,191,0.2) 0%, transparent 70%);
  }

  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,76,151,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,76,151,0.15) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove {
    0%   { background-position: 0 0; }
    100% { background-position: 60px 60px; }
  }

  .particles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: #3A8FD8;
    opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0); opacity: 0; }
    10%  { opacity: 0.5; transform: translateY(-10px) scale(1); }
    90%  { opacity: 0.25; }
    100% { transform: translateY(-120px) scale(0.3); opacity: 0; }
  }

  /* ── Layout ── */
  .layout {
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: 392px 1528px;
    grid-template-rows: 860px 220px;
  }

  /* Panel izquierdo — solo contenido, sin bordes */
  .panel-left {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 24px;
    gap: 32px;
  }

  .logo-wrap img {
    width: 200px;
    filter: brightness(0) invert(1);
  }

  /* Zona cámara — completamente vacía */
  .camera-zone {
    grid-column: 2;
    grid-row: 1;
    background: transparent;
  }

  /* Barra inferior izquierda */
  .bar-left {
    grid-column: 1;
    grid-row: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* Barra inferior derecha */
  .bar-bottom {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 48px;
    gap: 8px;
  }

  .bar-title {
    font-family: 'Raleway', sans-serif;
    font-size: 38px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .bar-subtitle {
    font-family: 'Raleway', sans-serif;
    font-size: 18px;
    font-weight: 300;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="bg-radial"></div>
  <div class="bg-grid"></div>
  <div class="particles" id="particles"></div>

  <div class="layout">

    <div class="panel-left">
      <div class="logo-wrap">
      <!--  <img src="/layouts/assets/logo-barcelo.png" alt="Fundación Barceló" width:100px> -->
	<img src="/layouts/assets/logo-barcelo.png" alt="Fundación Barceló" style="width:150px; filter:brightness(0) invert(1);">
      </div>
    </div>

    <div class="camera-zone"></div>

    <div class="bar-left">
    </div>

    <div class="bar-bottom">
      <div class="bar-title">Fundación Barceló · Mundial FIFA 2026</div>
      <div class="bar-subtitle">Bar Barceló · Lo miramos juntos</div>
    </div>

  </div>

  <script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 60; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        top: ${20 + Math.random() * 80}%;
        animation-duration: ${3 + Math.random() * 5}s;
        animation-delay: ${Math.random() * 8}s;
        width: ${1 + Math.random() * 3}px;
        height: ${1 + Math.random() * 3}px;
      `;
      container.appendChild(p);
    }
  </script>

</body>
</html>
