<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dos Participantes (Marco) — Barceló</title>
<link rel="stylesheet" href="/layouts/assets/marca-fondo.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
  }

  /* ── Variables del agujero ── */
  :root {
    --hole-x: 760px;   /* distancia desde la izquierda */
    --hole-y: 140px;   /* distancia desde arriba       */
    --hole-w: 400px;   /* ancho del agujero            */
    --hole-h: 800px;   /* alto del agujero             */
    --glow: rgba(255,255,255,0.85);
  }

  /* ── 4 paneles que rodean el hueco ── */

  /* ARRIBA */
  /* ABAJO */
  /* IZQUIERDA */
  /* DERECHA */

  /* ── Grilla animada sobre cada panel ── */

  /* ── Radiales de profundidad ── */

  /* ── Partículas ── */

  /* ── Borde glow del agujero ── */
  .hole-border {
    position: fixed;
    top: var(--hole-y);
    left: var(--hole-x);
    width: var(--hole-w);
    height: var(--hole-h);
    border: 1.5px solid var(--glow);
    box-shadow:
      0 0 6px 1px rgba(255,255,255,0.55),
      0 0 16px 3px rgba(255,255,255,0.15),
      inset 0 0 6px 1px rgba(255,255,255,0.08);
    border-radius: 4px;
    pointer-events: none;
  }

  /* ── Fondo de marca recortado: deja libre el agujero ── */
  .marca-bg {
    clip-path: polygon(evenodd,
      0 0, 100% 0, 100% 100%, 0 100%, 0 0,
      var(--hole-x) var(--hole-y),
      var(--hole-x) calc(var(--hole-y) + var(--hole-h)),
      calc(var(--hole-x) + var(--hole-w)) calc(var(--hole-y) + var(--hole-h)),
      calc(var(--hole-x) + var(--hole-w)) var(--hole-y),
      var(--hole-x) var(--hole-y));
  }
</style>
</head>
<body>

  <div class="marca-bg"><i class="m-losa m-navy"></i><i class="m-losa m-cian"></i><i class="m-losa m-alta"></i><i class="m-losa m-marco"></i></div>
  <script src="/layouts/assets/marca-fondo.js"></script>

  <!-- Efectos encima de los paneles -->

  <!-- Borde del agujero -->
  <div class="hole-border"></div>

</body>
</html>
