<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compartir Pantalla Izq — Barceló</title>
<link rel="stylesheet" href="/layouts/assets/marca-fondo.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #0061F0;
  }

  /* ===== Rectángulo croma 720p — Compartir Pantalla ===== */
  /* Vértice superior izquierdo en (26, 142) */
  .screen-share {
    position: absolute;
    top: 142px;
    left: 26px;
    width: 1280px;
    height: 720px;
    background: rgb(0, 255, 0);
    border: 1.7px solid #ffffff;
    box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.5);
  }

  /* ===== Rectángulo croma — Disertante ===== */
  /* Vértice superior izquierdo en (1322, 139) */
  .screen-speaker {
    position: absolute;
    top: 142px;
    left: 1322px;
    width: 576px;
    height: 720px;
    background: rgb(0, 255, 0);
    border: 1.7px solid #ffffff;
    box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.5);
  }
</style>
</head>
<body>
  <div class="marca-bg"><i class="m-losa m-navy"></i><i class="m-losa m-cian"></i><i class="m-losa m-alta"></i><i class="m-losa m-marco"></i></div>
  <script src="/layouts/assets/marca-fondo.js"></script>

  <div class="screen-share"></div>
  <div class="screen-speaker"></div>

</body>
</html>
