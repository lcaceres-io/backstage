<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tres Participantes — Barceló</title>
<link rel="stylesheet" href="/layouts/assets/marca-fondo.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #0061F0;
  }

  /* ===== Cuadrados croma — 3 participantes ===== */
  /* Ancho cuadrado: 602px (sin cambios). Gap interno reducido: 28px -> 12px */
  /* Margen lateral resultante: 45px c/lado */
  .cuadrado {
    position: absolute;
    top: 98px;
    width: 602px;
    height: 755px;
    background: rgb(0, 255, 0);
    border: 1.7px solid #ffffff;
    box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.5);
  }

  .cuadrado-1 { left: 45px; }    /* 45 */
  .cuadrado-2 { left: 659px; }   /* 45 + 602 + 12 */
  .cuadrado-3 { left: 1273px; }  /* 45 + 602 + 12 + 602 + 12 */
</style>
</head>
<body>
  <div class="marca-bg"><i class="m-luz m-luz1"></i><i class="m-luz m-luz2"></i><i class="m-panel m-p1"></i><i class="m-panel m-p2"></i></div>
  <script src="/layouts/assets/marca-fondo.js"></script>

  <div class="cuadrado cuadrado-1"></div>
  <div class="cuadrado cuadrado-2"></div>
  <div class="cuadrado cuadrado-3"></div>

</body>
</html>
