<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi — Fundación Barceló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* WiFi — Manual de marca Fundación Barceló 2026.
     Dos slides que rotan solos: 1) red y clave en texto, 2) QR para conectarse.
     La red y la clave se leen de wifi.json: al cambiar la clave, el QR se regenera solo.
     Parametros por URL (opcionales, pisan wifi.json):
       ?ssid=Red  ?clave=Clave  ?seg=12 (segundos por slide)  ?solo=texto | qr (fija un slide)
       ?tema=claro | oscuro  (por defecto claro; tambien se fija con "tema" en wifi.json)
     Diseno: jerarquia por peso y color y no por tamano, un solo protagonista (el dato), mucho aire,
     tarjetas con sombras suaves y un fondo en degradado que llega a todos los bordes. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --azul:#0061F0; --marino:#06038D; --cian:#00D1FF; }

  /* Temas: solo cambian variables */
  html.claro {
    --fondo: linear-gradient(140deg, #B8F0FF 0%, #9CC3FA 48%, #7FA8F6 100%);
    --luz1: rgba(255,255,255,.55); --luz2: rgba(0,97,240,.20);
    --titulo: #06038D; --texto: rgba(6,3,141,.78); --eyebrow: #06038D; --acento: #0061F0;
    --chip: #fff; --chipTxt: #06038D;
    --logo: #0061F0; --logoFondo: #fff; --logoSombra: 0 10px 26px rgba(6,3,141,.16);
    --punto: rgba(6,3,141,.22); --puntoOn: #06038D; --pista: rgba(6,3,141,.10);
  }
  html.oscuro {
    --fondo: linear-gradient(140deg, #0061F0 0%, #06038D 100%);
    --luz1: rgba(0,209,255,.30); --luz2: rgba(0,209,255,.20);
    --titulo: #fff; --texto: rgba(255,255,255,.86); --eyebrow: #00D1FF; --acento: #fff;
    --chip: #00D1FF; --chipTxt: #06038D;
    --logo: #fff; --logoFondo: transparent; --logoSombra: none;
    --punto: rgba(255,255,255,.35); --puntoOn: #00D1FF; --pista: rgba(255,255,255,.14);
  }

  html, body { width: 100%; height: 100%; overflow: hidden; background: #7FA8F6; }
  body { font-family: 'Sofia Pro', 'Montserrat', sans-serif; color: var(--titulo); }

  /* Fondo a pantalla completa (fuera del escenario escalado, asi llega a todos los bordes) */
  #fondo { position: fixed; inset: 0; background: var(--fondo); overflow: hidden; }
  #fondo i { position: absolute; display: block; border-radius: 50%; will-change: transform; }
  #fondo .l1 { width: 90vw; height: 80vh; left: -25vw; top: -30vh;
               background: radial-gradient(closest-side, var(--luz1), rgba(255,255,255,0)); animation: l1 18s ease-in-out infinite alternate; }
  #fondo .l2 { width: 80vw; height: 75vh; right: -22vw; bottom: -28vh;
               background: radial-gradient(closest-side, var(--luz2), rgba(0,0,0,0)); animation: l2 22s ease-in-out infinite alternate; }
  @keyframes l1 { from { transform: translate(-3vw, -2vh); } to { transform: translate(14vw, 9vh); } }
  @keyframes l2 { from { transform: translate(5vw, 3vh); }   to { transform: translate(-12vw, -8vh); } }

  /* Escenario fijo 1920x1080 que se escala para entrar en cualquier pantalla */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

  .logo-chip { position: absolute; left: 90px; top: 64px; z-index: 5; padding: 18px 26px; border-radius: 18px;
               background: var(--logoFondo); box-shadow: var(--logoSombra); }
  html.oscuro .logo-chip { padding: 0; }
  .logo { display: block; width: 170px; height: 59px; background: var(--logo);
          -webkit-mask: url(/layouts/assets/logo-fundacion-blanco.png) left center / contain no-repeat;
                  mask: url(/layouts/assets/logo-fundacion-blanco.png) left center / contain no-repeat; }

  .slide { position: absolute; inset: 0; z-index: 2; opacity: 0; visibility: hidden;
           transition: opacity .6s ease, visibility 0s linear .6s; }
  .slide.active { opacity: 1; visibility: visible; transition: opacity .6s ease; }
  .slide .item { opacity: 0; }
  .slide.active .item { animation: sube .9s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i, 0) * .12s + .15s); }
  @keyframes sube { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }

  /* Texto: la jerarquia sale del peso y el color */
  .col { position: absolute; left: 170px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-size: 22px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--eyebrow); margin-bottom: 22px; }
  h1 { font-size: 84px; line-height: 1.06; font-weight: 700; letter-spacing: -.025em; color: var(--titulo); }
  .sub { font-size: 30px; font-weight: 500; color: var(--texto); margin-top: 22px; }

  /* ---------- Slide 1: red y clave ---------- */
  .s-texto .col { width: 1000px; }
  .datos { margin-top: 56px; }
  .dato { background: #fff; color: var(--marino); border-radius: 22px; padding: 0 40px; height: 124px; margin-bottom: 18px;
          display: flex; align-items: center; gap: 36px;
          box-shadow: 0 1px 2px rgba(6,3,141,.06), 0 8px 20px rgba(6,3,141,.08), 0 26px 52px rgba(6,3,141,.12); }
  .dato .rotulo { flex: 0 0 140px; font-size: 21px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--azul); }
  .dato .valor { flex: 1; min-width: 0; font-size: 58px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; line-height: 1.12; }
  .dato.clave .valor { letter-spacing: .01em; }
  .s-texto .nota { margin-top: 26px; font-size: 24px; font-weight: 500; color: var(--texto); }

  .wifi-wrap { position: absolute; left: 1280px; top: 50%; width: 420px; height: 420px; margin-top: -210px; }
  .wifi { width: 100%; height: 100%; display: block; }
  .wifi path { fill: none; stroke: var(--acento); stroke-width: 24; stroke-linecap: round; }
  .wifi circle { fill: var(--acento); }
  html.claro .wifi path, html.claro .wifi circle { filter: drop-shadow(0 8px 14px rgba(6,3,141,.18)); }
  .wifi .a1, .wifi .a2, .wifi .a3 { opacity: .3; animation: onda 2.6s ease-in-out infinite; }
  .wifi .a2 { animation-delay: .25s; } .wifi .a3 { animation-delay: .5s; }
  .wifi .punto { animation: punto 2.6s ease-in-out infinite; transform-origin: 210px 340px; }
  @keyframes onda { 0%, 100% { opacity: .3; } 35%, 55% { opacity: 1; } }
  @keyframes punto { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.16); } }

  /* ---------- Slide 2: QR ---------- */
  .s-qr .col { width: 860px; }
  .pasos { list-style: none; margin-top: 52px; }
  .pasos li { display: flex; align-items: center; gap: 24px; font-size: 30px; font-weight: 600; color: var(--titulo); margin-bottom: 22px; }
  .pasos .n { flex: 0 0 56px; height: 56px; border-radius: 16px; background: var(--chip); color: var(--chipTxt);
              font-size: 26px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(6,3,141,.12); }
  .s-qr .red { margin-top: 30px; font-size: 26px; font-weight: 500; color: var(--texto); }
  .s-qr .red b { font-weight: 800; color: var(--titulo); }

  .qr-card { position: absolute; left: 1230px; top: 50%; width: 520px; height: 520px; margin-top: -260px; border-radius: 34px; background: #fff;
             box-shadow: 0 1px 2px rgba(6,3,141,.06), 0 10px 24px rgba(6,3,141,.10), 0 32px 64px rgba(6,3,141,.16);
             overflow: hidden; padding: 22px; }
  .qr-card svg { width: 100%; height: 100%; display: block; }
  .scan { position: absolute; left: 0; right: 0; top: 0; height: 100px; pointer-events: none;
          background: linear-gradient(180deg, rgba(0,209,255,0), rgba(0,209,255,.14) 70%, rgba(0,209,255,0));
          border-bottom: 3px solid rgba(0,209,255,.5); animation: barre 3.6s ease-in-out infinite; }
  @keyframes barre { 0% { transform: translateY(-100px); } 100% { transform: translateY(520px); } }
  .esquina { position: absolute; width: 56px; height: 56px; border: 6px solid var(--azul); }
  .esquina.tl { left: 12px; top: 12px; border-right: 0; border-bottom: 0; border-top-left-radius: 20px; }
  .esquina.tr { right: 12px; top: 12px; border-left: 0; border-bottom: 0; border-top-right-radius: 20px; }
  .esquina.bl { left: 12px; bottom: 12px; border-right: 0; border-top: 0; border-bottom-left-radius: 20px; }
  .esquina.br { right: 12px; bottom: 12px; border-left: 0; border-top: 0; border-bottom-right-radius: 20px; }
  .qr-error { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 40px;
              font-size: 28px; font-weight: 700; color: var(--marino); }

  /* ---------- Progreso ---------- */
  .puntos { position: absolute; left: 170px; bottom: 56px; display: flex; gap: 10px; z-index: 5; }
  .puntos i { width: 12px; height: 12px; border-radius: 6px; background: var(--punto); transition: width .4s, background .4s; }
  .puntos i.on { width: 40px; background: var(--puntoOn); }
  .progreso { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--pista); z-index: 5; }
  .progreso i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--azul), var(--cian)); }
  @keyframes llena { from { width: 0; } to { width: 100%; } }
</style>
</head>
<body>
<div id="fondo"><i class="l1"></i><i class="l2"></i></div>

<div id="stage">
  <div class="logo-chip"><div class="logo" role="img" aria-label="Fundación Barceló"></div></div>

  <!-- Slide 1: red y clave -->
  <section class="slide s-texto" id="sTexto">
    <div class="wifi-wrap item" style="--i:2">
      <svg class="wifi" viewBox="0 0 420 420" aria-hidden="true">
        <path class="a3" d="M30 160 A250 250 0 0 1 390 160"/>
        <path class="a2" d="M85 222 A170 170 0 0 1 335 222"/>
        <path class="a1" d="M140 282 A90 90 0 0 1 280 282"/>
        <circle class="punto" cx="210" cy="340" r="26"/>
      </svg>
    </div>
    <div class="col">
      <div class="eyebrow item" style="--i:0">WiFi</div>
      <h1 class="item" style="--i:1">Conectate<br>a nuestra red</h1>
      <div class="sub item" style="--i:2">Usá estos datos desde tu celular o tu notebook</div>
      <div class="datos">
        <div class="dato item" style="--i:3"><div class="rotulo">Red</div><div class="valor" id="vRed"></div></div>
        <div class="dato clave item" style="--i:4"><div class="rotulo">Clave</div><div class="valor" id="vClave"></div></div>
      </div>
      <div class="nota item" style="--i:5">También podés escanear el código QR</div>
    </div>
  </section>

  <!-- Slide 2: QR -->
  <section class="slide s-qr" id="sQr">
    <div class="col">
      <div class="eyebrow item" style="--i:0">WiFi</div>
      <h1 class="item" style="--i:1">Escaneá<br>y conectate</h1>
      <div class="sub item" style="--i:2">Sin escribir la clave</div>
      <ol class="pasos">
        <li class="item" style="--i:3"><span class="n">1</span>Abrí la cámara del celular</li>
        <li class="item" style="--i:4"><span class="n">2</span>Apuntá al código</li>
        <li class="item" style="--i:5"><span class="n">3</span>Tocá «Conectar»</li>
      </ol>
      <div class="red item" style="--i:6">Red: <b id="vRed2"></b></div>
    </div>
    <div class="qr-card item" style="--i:2">
      <div id="qr"></div>
      <div class="qr-error" id="qrError"></div>
      <div class="scan"></div>
      <i class="esquina tl"></i><i class="esquina tr"></i><i class="esquina bl"></i><i class="esquina br"></i>
    </div>
  </section>

  <div class="puntos" id="puntos"><i></i><i></i></div>
  <div class="progreso"><i id="barra"></i></div>
</div>

<script src="qr.js"></script>
<script>
(function () {
  // Valores por defecto: se reemplazan por wifi.json y, encima, por los parametros de la URL.
  var BASE = { ssid: 'NOMBRE-DE-RED', password: 'CLAVE', security: 'WPA', hidden: false, segundosPorSlide: 12, tema: 'claro' };
  var params = new URLSearchParams(location.search);
  var $ = function (id) { return document.getElementById(id); };
  function tema(t) {
    var h = document.documentElement.classList;
    h.toggle('oscuro', t === 'oscuro'); h.toggle('claro', t !== 'oscuro');
  }
  tema(params.get('tema'));

  // ---- escala el escenario a la pantalla (el fondo ya llena toda la ventana por su cuenta) ----
  var stage = $('stage');
  function escalar() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = 'translate(' + (innerWidth - 1920 * s) / 2 + 'px,' + (innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
  }
  addEventListener('resize', escalar); escalar();

  // ---- texto que no entra: achica la fuente; si aun asi no entra, baja a dos lineas ----
  function ajustar(el) {
    el.style.fontSize = ''; el.style.whiteSpace = ''; el.style.wordBreak = ''; el.style.lineHeight = '';
    var px = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && px > 34) { px -= 2; el.style.fontSize = px + 'px'; }
    if (el.scrollWidth > el.clientWidth) {
      el.style.whiteSpace = 'normal'; el.style.wordBreak = 'break-all'; el.style.lineHeight = '1.1';
      el.style.fontSize = '36px';
    }
  }

  // ---- cadena WIFI: del estandar que leen las camaras de iOS y Android ----
  function esc(t) { return String(t).replace(/([\\;,:"])/g, '\\$1'); }
  function cadenaWifi(c) {
    var t = c.security === 'nopass' ? 'nopass' : (c.security === 'WEP' ? 'WEP' : 'WPA');
    var s = 'WIFI:T:' + t + ';S:' + esc(c.ssid) + ';';
    if (t !== 'nopass') s += 'P:' + esc(c.password) + ';';
    if (c.hidden) s += 'H:true;';
    return s + ';';
  }

  function dibujarQr(texto) {
    var box = $('qr'), err = $('qrError');
    try {
      var q = BarceloQR.encode(texto, 'M'), n = q.size, z = 4, d = '';
      for (var y = 0; y < n; y++) {
        for (var x = 0; x < n; x++) {
          if (!q.modules[y][x]) continue;
          var ini = x; while (x + 1 < n && q.modules[y][x + 1]) x++;
          d += 'M' + (ini + z) + ' ' + (y + z) + 'h' + (x - ini + 1) + 'v1h-' + (x - ini + 1) + 'z';
        }
      }
      var T = n + z * 2;
      box.innerHTML = '<svg viewBox="0 0 ' + T + ' ' + T + '" shape-rendering="crispEdges" role="img" aria-label="Código QR para conectarse al WiFi">' +
        '<rect width="' + T + '" height="' + T + '" fill="#fff"/><path d="' + d + '" fill="#06038D"/></svg>';
      err.style.display = 'none';
    } catch (e) {
      box.innerHTML = '';
      err.textContent = 'La red o la clave son demasiado largas para generar el código QR.';
      err.style.display = 'grid';
    }
  }

  // ---- aplica la configuracion a la pagina ----
  var actual = '', SEG = BASE.segundosPorSlide;
  function aplicar(cfg) {
    var c = Object.assign({}, BASE, cfg || {});
    if (params.get('ssid')) c.ssid = params.get('ssid');
    if (params.get('clave')) c.password = params.get('clave');
    if (params.get('seg')) c.segundosPorSlide = parseFloat(params.get('seg'));
    tema(params.get('tema') || c.tema);
    var firma = JSON.stringify(c);
    if (firma === actual) return;       // sin cambios: no toca nada
    actual = firma;
    $('vRed').textContent = c.ssid;
    $('vRed2').textContent = c.ssid;
    $('vClave').textContent = c.security === 'nopass' ? 'Sin clave' : c.password;
    ajustar($('vRed')); ajustar($('vClave'));
    dibujarQr(cadenaWifi(c));
    SEG = Math.max(4, c.segundosPorSlide || 12);
  }

  function leerConfig() {
    return fetch('wifi.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  // ---- rotacion de slides ----
  var slides = [$('sTexto'), $('sQr')], puntos = $('puntos').children, barra = $('barra');
  var solo = params.get('solo'), idx = solo === 'qr' ? 1 : 0, timer = null;
  function mostrar(i) {
    idx = (i + slides.length) % slides.length;
    slides.forEach(function (s, k) { s.classList.toggle('active', k === idx); });
    for (var k = 0; k < puntos.length; k++) puntos[k].classList.toggle('on', k === idx);
    clearTimeout(timer);
    barra.style.animation = 'none'; void barra.offsetWidth;
    if (!solo) {
      barra.style.animation = 'llena ' + SEG + 's linear forwards';
      timer = setTimeout(function () { mostrar(idx + 1); }, SEG * 1000);
    }
  }
  if (solo) { $('puntos').style.display = 'none'; document.querySelector('.progreso').style.display = 'none'; }
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ') mostrar(idx + 1);
    else if (e.key === 'ArrowLeft') mostrar(idx - 1);
  });

  // ---- arranque: lee wifi.json y lo vuelve a leer cada 30 s (cambia la clave y el QR se regenera solo) ----
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(leerConfig).then(function (cfg) {
    aplicar(cfg);
    mostrar(idx);
    setInterval(function () { leerConfig().then(function (c) { if (c) aplicar(c); }); }, 30000);
  });
})();
</script>
</body>
</html>
